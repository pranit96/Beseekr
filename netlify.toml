[build]
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_ENV = "production"
  SECRETS_SCAN_OMIT_KEYS = "VITE_API_BASE_URL"

# 🎯 CRITICAL: Proxy API requests to backend
[[redirects]]
  from = "/api/*"
  to = "https://agent-backend-275v.onrender.com/api/:splat"
  status = 200
  force = true

# 🎯 Security headers for all routes
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# 🎯 Cache settings for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 🎯 Single Page App (SPA) configuration
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Role = "all"}