    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Beseekr",
        "url": "https://beseekr.com",
        "logo": "https://beseekr.com/logo.png",
        "description": "AI-powered multi-agent platform for advanced orchestration, prompt weaving, and market research",
        "sameAs": [
          "https://twitter.com/beseekr",
          "https://linkedin.com/company/beseekr"
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "email": "hello@support.beseekr.com",
          "contactType": "customer service"
        }
      }
    </script>

    <!-- Structured Data - WebSite with SearchAction -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Beseekr",
        "url": "https://beseekr.com",
        "description": "AI-powered platform to compress weeks of product development and research into minutes using multi-agent workflows",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://beseekr.com/dashboard/search?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- Structured Data - SoftwareApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Beseekr",
        "operatingSystem": "Web",
        "applicationCategory": "BusinessApplication",
        "description": "Sophisticated AI co-pilot featuring multi-agent orchestration, prompt engineering workflows, and deep problem validation.",
        "offers": {
          "@type": "AggregateOffer",
          "lowPrice": "0",
          "highPrice": "799",
          "priceCurrency": "INR",
          "offerCount": "3"
        },
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.8",
          "ratingCount": "50",
          "bestRating": "5",
          "worstRating": "1"
        },
        "featureList": [
          "Multi-agent AI orchestration",
          "Prompt weaving and engineering",
          "AI-powered problem discovery",
          "Market demand validation",
          "Real-time research reports"
        ]
      }
    </script>

    <!-- Structured Data - FAQ -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is Beseekr?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Beseekr is a comprehensive AI-driven platform for ambitious builders, founders, and product teams. It acts as a powerful co-pilot offering multi-agent workflows, prompt weaving, and deep market problem discovery."
            }
          },
          {
            "@type": "Question",
            "name": "What can the AI Orchestrator do?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The AI Chat interface allows you to craft complex prompts and command various specialized AI sub-agents to brainstorm, write code, or perform strategic research autonomously at scale."
            }
          },
          {
            "@type": "Question",
            "name": "How does Beseekr find startup ideas?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Beseekr uses aggressive background ingestion to analyze public discussions on Reddit and forums, identifying validated pain points and unmet market needs scored by its proprietary AI."
            }
          }
        ]
      }
    </script>

    <!-- Critical CSS for initial paint - inlined to avoid render blocking -->
    <style>
      /* Critical above-the-fold styles */
      :root {
        --background: 0 0% 100%;
        --foreground: 240 10% 3.9%;
        --primary: 160 84% 39%;
        --muted: 240 4.8% 95.9%;
        --muted-foreground: 240 3.8% 46.1%;
      }
      .dark {
        --background: 240 10% 3.9%;
        --foreground: 0 0% 98%;
        --primary: 160 84% 39%;
        --muted: 240 3.7% 15.9%;
        --muted-foreground: 240 5% 64.9%;
      }
      *,
      ::before,
      ::after {
        box-sizing: border-box;
        border-width: 0;
        border-style: solid;
      }
      html {
        line-height: 1.5;
        -webkit-text-size-adjust: 100%;
        font-family: Inter, system-ui, sans-serif;
      }
      body {
        margin: 0;
        line-height: inherit;
        background-color: hsl(var(--background));
        color: hsl(var(--foreground));
      }
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      /* Skeleton animation */
      @keyframes skeleton {
        from {
          opacity: 1;
        }
        to {
          opacity: 0.5;
        }
      }
      .skeleton {
        animation: skeleton 1s ease-in-out infinite alternate;
        background: hsl(var(--muted));
        border-radius: 0.5rem;
      }
    </style>
  </head>
